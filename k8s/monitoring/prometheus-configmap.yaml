apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'vllm'
        static_configs:
          - targets: ['llama-8b-service:8000']
      - job_name: 'rainference-backend'
        static_configs:
          - targets: ['backend-service:8000']
